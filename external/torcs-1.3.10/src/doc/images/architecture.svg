<svg xmlns="http://www.w3.org/2000/svg" width="800" height="660" viewBox="0 0 800 660" role="img" aria-labelledby="title desc">
  <title id="title">Architecture overview</title>
  <desc id="desc">Three component families: orchestration contains Entry, Menu and State Engine; shared APIs and libraries provide interfaces and common services; runtime plugins provide Rendering, Simulation, Track and Robot implementations. The layers group responsibilities, rather than showing a call sequence.</desc>
  <!-- SPDX-License-Identifier: GFDL-1.2-or-later -->
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #243c4b; }
    .title { font-size: 26px; font-weight: bold; }
    .heading { font-size: 20px; font-weight: bold; }
    .body { font-size: 16px; }
    .small { font-size: 15px; fill: #526774; }
    .card { fill: white; stroke: #dfe6e7; stroke-width: 1.5; }
    .blue { fill: #397591; }
    .teal { fill: #168376; }
  </style>
  <rect width="800" height="660" fill="#fffdfa"/>
  <text x="32" y="42" class="title">Architecture overview</text>
  <text x="32" y="70" class="body">Three component families, from program flow to runtime implementations.</text>

  <rect x="24" y="96" width="752" height="180" rx="12" class="card"/>
  <text x="44" y="129" class="heading blue">Orchestration</text>
  <text x="44" y="153" class="small">Controls startup, configuration and the simulation lifecycle.</text>
  <g text-anchor="middle">
    <rect x="44" y="174" width="224" height="82" rx="12" fill="#eef5f8"/>
    <text x="156" y="204" class="heading">Entry</text>
    <text x="156" y="230" class="small">Command line / GUI mode</text>
    <rect x="288" y="174" width="224" height="82" rx="12" fill="#eef5f8"/>
    <text x="400" y="204" class="heading">Menu</text>
    <text x="400" y="230" class="small">User choices and settings</text>
    <rect x="532" y="174" width="224" height="82" rx="12" fill="#eef5f8"/>
    <text x="644" y="204" class="heading">State Engine</text>
    <text x="644" y="230" class="small">Race manager execution</text>
  </g>

  <rect x="24" y="296" width="752" height="122" rx="12" class="card"/>
  <text x="44" y="330" class="heading">Shared API and libraries</text>
  <text x="44" y="358" class="body">Interfaces and common services used across the architecture.</text>
  <text x="44" y="388" class="small">XML parameters · Robot tools · Portability · Math · Learning</text>

  <rect x="24" y="438" width="752" height="172" rx="12" class="card"/>
  <text x="44" y="471" class="heading teal">Plugins</text>
  <text x="44" y="495" class="small">Loaded at runtime through defined interfaces, selected by configuration.</text>
  <g text-anchor="middle">
    <rect x="44" y="516" width="166" height="74" rx="12" fill="#edf7f4"/>
    <text x="127" y="546" class="heading">Rendering</text>
    <text x="127" y="572" class="small">Graphics and sound</text>
    <rect x="226" y="516" width="166" height="74" rx="12" fill="#edf7f4"/>
    <text x="309" y="546" class="heading">Simulation</text>
    <text x="309" y="572" class="small">Physics time steps</text>
    <rect x="408" y="516" width="166" height="74" rx="12" fill="#edf7f4"/>
    <text x="491" y="546" class="heading">Track</text>
    <text x="491" y="572" class="small">Track loading</text>
    <rect x="590" y="516" width="166" height="74" rx="12" fill="#edf7f4"/>
    <text x="673" y="546" class="heading">Robot</text>
    <text x="673" y="572" class="small">Driver controls</text>
  </g>
  <text x="32" y="640" class="small">Responsibility map — the layers do not imply a fixed call sequence.</text>
</svg>
