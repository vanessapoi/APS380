<svg xmlns="http://www.w3.org/2000/svg" width="800" height="570" viewBox="0 0 800 570" role="img" aria-labelledby="title description">
  <title id="title">Choose the end that has room</title>
  <desc id="description">Two equal top-down road views have a barrier on the left. In the first, the car's nose touches it; reversing moves the car to the right, away from the barrier. In the second, the rear touches it; forward motion moves the car to the right. Travel along the road is upward in both views.</desc>
  <!-- Copyright (C) 2026 Bernhard Wymann. GNU FDL 1.2 or later,
       with no Invariant Sections, Front-Cover Texts or Back-Cover Texts. -->
  <defs>
    <marker id="motion-arrow" markerWidth="11" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#168376" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="road-arrow" markerWidth="11" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#397591" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <pattern id="barrier-hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-2 2 L2 -2 M0 8 L8 0 M6 10 L10 6" stroke="#b6c1c6" stroke-width="1"/></pattern>
    <g id="car">
      <g fill="#283b46">
        <rect x="-33" y="-38" width="9" height="23" rx="3"/>
        <rect x="24" y="-38" width="9" height="23" rx="3"/>
        <rect x="-33" y="25" width="9" height="23" rx="3"/>
        <rect x="24" y="25" width="9" height="23" rx="3"/>
      </g>
      <path d="M-15 -64 Q-23 -62 -26 -49 L-28 -25 L-25 6 Q-31 30 -29 47 Q-28 60 -17 64 L17 64 Q28 60 29 47 Q31 30 25 6 L28 -25 L26 -49 Q23 -62 15 -64 Z" fill="#db5947" stroke="#943e34" stroke-width="1.6"/>
      <path d="M-3 -61 H3 V-28 H-3 Z M-3 43 H3 V61 H-3 Z" fill="#fff6de"/>
      <path d="M-24 -21 Q0 -34 24 -21 L19 -2 Q0 -9 -19 -2 Z" fill="#bcd6dc" stroke="#536e7a" stroke-width="1.3"/>
      <path d="M-18 26 Q0 34 18 26 L22 42 Q0 50 -22 42 Z" fill="#bcd6dc" stroke="#536e7a" stroke-width="1.3"/>
      <path d="M-22 -12 L-22 18 L-17 23 L-17 2 Z M22 -12 L22 18 L17 23 L17 2 Z" fill="#486576"/>
      <path d="M-17 -1 Q0 -7 17 -1 L17 25 Q0 31 -17 25 Z" fill="#eb7058"/>
      <g fill="#fff1c9" stroke="#943e34" stroke-width="1">
        <path d="M-23 -47 L-12 -51 L-11 -43 L-24 -39 Z"/>
        <path d="M23 -47 L12 -51 L11 -43 L24 -39 Z"/>
      </g>
      <path d="M-23 55 H-11 M11 55 H23" stroke="#8d342f" stroke-width="3" stroke-linecap="round"/>
      <path d="M-10 -35 Q0 -38 10 -35" fill="none" stroke="#b14539" stroke-width="1.2"/>
    </g>
    <g id="road">
      <path d="M64 85 H324 V331 H64 Z" fill="#f0f4f4"/>
      <path d="M324 85 V331" stroke="#bbc9cd" stroke-width="1.5"/>
      <path d="M194 85 V331" stroke="#a7b9c0" stroke-width="1.5" stroke-dasharray="7 8"/>
      <rect x="51" y="85" width="13" height="246" fill="#dfe5e7"/>
      <rect x="51" y="85" width="13" height="246" fill="url(#barrier-hatch)"/>
      <path d="M64 85 V331" stroke="#526774" stroke-width="3"/>
    </g>
  </defs>
  <rect width="800" height="570" rx="16" fill="#fffdfa"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#243c4b">
    <text x="24" y="29" font-size="11" font-weight="700" letter-spacing="2">RECOVERY / CHOOSE A DIRECTION</text>
    <text x="24" y="62" font-size="26" font-weight="700">Choose the end that has room.</text>
    <path d="M660 31 V16" fill="none" stroke="#397591" stroke-width="1.8" marker-end="url(#road-arrow)"/>
    <text x="674" y="28" font-size="12" fill="#526774">Travel direction</text>
    <g transform="translate(16 86)">
      <rect width="376" height="426" rx="12" fill="#fff" stroke="#dfe6e7"/>
      <circle cx="27" cy="31" r="12" fill="#e6f3ee"/>
      <text x="27" y="35" text-anchor="middle" font-size="13" font-weight="700" fill="#168376">1</text>
      <text x="49" y="37" font-size="20" font-weight="700">Nose at the barrier</text>
      <text x="20" y="64" font-size="15" fill="#526774">The front points out of the road.</text>
      <use href="#road"/>
      <use href="#car" transform="translate(128 226) rotate(-90)"/>
      <circle cx="64" cy="226" r="9" fill="none" stroke="#c47a35" stroke-width="2"/>
      <text x="228" y="200" font-size="15" font-weight="700" fill="#168376">Reverse</text>
      <path d="M223 226 H291" fill="none" stroke="#168376" stroke-width="2.5" marker-end="url(#motion-arrow)"/>
      <text x="20" y="363" font-size="16" font-weight="700">Back away.</text>
      <text x="20" y="387" font-size="15" fill="#526774">Reverse moves the car into free space.</text>
      <text x="20" y="409" font-size="15" fill="#526774">More forward throttle keeps it trapped.</text>
    </g>
    <g transform="translate(408 86)">
      <rect width="376" height="426" rx="12" fill="#fff" stroke="#dfe6e7"/>
      <circle cx="27" cy="31" r="12" fill="#e6f3ee"/>
      <text x="27" y="35" text-anchor="middle" font-size="13" font-weight="700" fill="#168376">2</text>
      <text x="49" y="37" font-size="20" font-weight="700">Rear at the barrier</text>
      <text x="20" y="64" font-size="15" fill="#526774">The front points into the road.</text>
      <use href="#road"/>
      <use href="#car" transform="translate(128 226) rotate(90)"/>
      <circle cx="64" cy="226" r="9" fill="none" stroke="#c47a35" stroke-width="2"/>
      <text x="228" y="200" font-size="15" font-weight="700" fill="#168376">Forward</text>
      <path d="M223 226 H291" fill="none" stroke="#168376" stroke-width="2.5" marker-end="url(#motion-arrow)"/>
      <text x="20" y="363" font-size="16" font-weight="700">Drive away.</text>
      <text x="20" y="387" font-size="15" fill="#526774">The space ahead is useful now.</text>
      <text x="20" y="409" font-size="15" fill="#526774">Reversing would push into the barrier.</text>
    </g>
    <path d="M24 532 H776" stroke="#dfe6e7"/>
    <text x="24" y="555" font-size="15" fill="#526774">Being stuck is not the same thing as needing reverse. Look at the car's orientation.</text>
  </g>
</svg>
