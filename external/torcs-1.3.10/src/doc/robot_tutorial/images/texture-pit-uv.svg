<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="title desc">
  <title id="title">Put the pit message in the top two-thirds of the image</title>
  <desc id="desc">A schematic 256-pixel square is divided at image row 171.5, corresponding to texture coordinate v equals 0.33. Keep the message above the division and a uniform perimeter around the image. The wall samples u from minus 0.7 to 1.3 and v from 0.33 to 1.1, so outside coordinates extend the edge colour.</desc>
  <!-- Copyright (C) 2026 Bernhard Wymann. GNU FDL 1.2-or-later. -->
  <rect width="800" height="480" fill="#fffdfa"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#243c4b">
    <text x="30" y="42" font-size="26">A square image, a partially sampled wall sign</text>
    <text x="30" y="70" font-size="15" fill="#526774">Schematic pixel layout. Image rows increase downward; texture v increases upward.</text>
    <rect x="46" y="108" width="288" height="288" fill="#747e84"/>
    <rect x="54" y="116" width="272" height="176" fill="#edf5f3"/>
    <text x="190" y="178" text-anchor="middle" font-size="22">MAIN MESSAGE</text>
    <text x="190" y="209" text-anchor="middle" font-size="16">Leave clear margins.</text>
    <text x="190" y="243" text-anchor="middle" font-size="15">Keep the outer edge uniform.</text>
    <path d="M38 300.96 H346" stroke="#397591" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="190" y="343" text-anchor="middle" font-size="18" fill="#fff">LOWER THIRD</text>
    <text x="190" y="370" text-anchor="middle" font-size="15" fill="#fff">not sampled on this wall</text>
    <g font-size="16"><text x="378" y="128">Top edge: row 0, v = 1</text><text x="378" y="215">Visible source region: about 67%</text><text x="378" y="303">Boundary: row ≈ 171.5, v = 0.33</text><text x="378" y="395">Bottom edge: row 256, v = 0</text></g>
    <g stroke="#a7b9c0" stroke-width="1.2"><path d="M334 108 H360"/><path d="M334 300.96 H360"/><path d="M334 396 H360"/></g>
    <text x="46" y="428" font-size="15" fill="#526774">Wall coordinates: u = −0.7 … 1.3 and v = 0.33 … 1.1.</text>
    <text x="46" y="456" font-size="15" fill="#526774">Outside the image, edge sampling supplies the surrounding wall appearance.</text>
  </g>
</svg>
