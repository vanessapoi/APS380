<svg xmlns="http://www.w3.org/2000/svg" width="800" height="530" viewBox="0 0 800 530" role="img" aria-labelledby="title description">
  <title id="title">Almost parallel. Still pointing at the wall.</title>
  <desc id="description">A car near the left barrier points eight degrees outward from the road direction. A dashed rectangle shows its simplified four-corner footprint. Its front-left corner is close to the wall. The enlarged view shows the small clearance. Continuing forward without changing heading reduces this gap. This does not imply that a forward steering correction cannot free the car.</desc>
  <!-- Copyright (C) 2026 Bernhard Wymann. GNU FDL 1.2 or later,
       with no Invariant Sections, Front-Cover Texts or Back-Cover Texts. -->
  <defs>
    <marker id="road-arrow" markerWidth="11" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#397591" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <pattern id="barrier-hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-2 2 L2 -2 M0 8 L8 0 M6 10 L10 6" stroke="#b6c1c6" stroke-width="1"/></pattern>
    <g id="car">
      <g fill="#283b46">
        <rect x="-33" y="-38" width="9" height="23" rx="3"/>
        <rect x="24" y="-38" width="9" height="23" rx="3"/>
        <rect x="-33" y="25" width="9" height="23" rx="3"/>
        <rect x="24" y="25" width="9" height="23" rx="3"/>
      </g>
      <path d="M-15 -64 Q-23 -62 -26 -49 L-28 -25 L-25 6 Q-31 30 -29 47 Q-28 60 -17 64 L17 64 Q28 60 29 47 Q31 30 25 6 L28 -25 L26 -49 Q23 -62 15 -64 Z" fill="#db5947" stroke="#943e34" stroke-width="1.6"/>
      <path d="M-3 -61 H3 V-28 H-3 Z M-3 43 H3 V61 H-3 Z" fill="#fff6de"/>
      <path d="M-24 -21 Q0 -34 24 -21 L19 -2 Q0 -9 -19 -2 Z" fill="#bcd6dc" stroke="#536e7a" stroke-width="1.3"/>
      <path d="M-18 26 Q0 34 18 26 L22 42 Q0 50 -22 42 Z" fill="#bcd6dc" stroke="#536e7a" stroke-width="1.3"/>
      <path d="M-22 -12 L-22 18 L-17 23 L-17 2 Z M22 -12 L22 18 L17 23 L17 2 Z" fill="#486576"/>
      <path d="M-17 -1 Q0 -7 17 -1 L17 25 Q0 31 -17 25 Z" fill="#eb7058"/>
      <g fill="#fff1c9" stroke="#943e34" stroke-width="1">
        <path d="M-23 -47 L-12 -51 L-11 -43 L-24 -39 Z"/>
        <path d="M23 -47 L12 -51 L11 -43 L24 -39 Z"/>
      </g>
      <path d="M-23 55 H-11 M11 55 H23" stroke="#8d342f" stroke-width="3" stroke-linecap="round"/>
      <path d="M-10 -35 Q0 -38 10 -35" fill="none" stroke="#b14539" stroke-width="1.2"/>
    </g>
    <g id="scene">
      <path d="M102 80 H324 V331 H102 Z" fill="#f0f4f4"/>
      <path d="M324 80 V331" stroke="#bbc9cd" stroke-width="1.5"/>
      <path d="M213 80 V331" stroke="#a7b9c0" stroke-width="1.5" stroke-dasharray="7 8"/>
      <rect x="89" y="80" width="13" height="251" fill="#dfe5e7"/>
      <rect x="89" y="80" width="13" height="251" fill="url(#barrier-hatch)"/>
      <path d="M102 80 V331" stroke="#526774" stroke-width="2"/>
      <g transform="translate(142.5 237) rotate(-8) scale(.87)">
        <rect x="-33" y="-64" width="66" height="128" fill="none" stroke="#9b703f" stroke-width="1.3" stroke-dasharray="4 3"/>
        <use href="#car"/>
        <circle cx="-33" cy="-64" r="3" fill="#c47a35"/>
      </g>
    </g>
  </defs>
  <rect width="800" height="530" rx="16" fill="#fffdfa"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#243c4b">
    <text x="24" y="29" font-size="11" font-weight="700" letter-spacing="2">RECOVERY / CHECK THE CORNERS</text>
    <text x="24" y="62" font-size="26" font-weight="700">Almost parallel. Still pointing at the wall.</text>
    <path d="M660 31 V16" fill="none" stroke="#397591" stroke-width="1.8" marker-end="url(#road-arrow)"/>
    <text x="674" y="28" font-size="12" fill="#526774">Travel direction</text>
    <g transform="translate(16 86)">
      <rect width="376" height="382" rx="12" fill="#fff" stroke="#dfe6e7"/>
      <text x="20" y="35" font-size="20" font-weight="700">Only 8° from the road...</text>
      <text x="20" y="62" font-size="15" fill="#526774">But the nose points slightly outward.</text>
      <use href="#scene"/>
      <rect x="88" y="155" width="84" height="60" rx="2" fill="none" stroke="#9b703f" stroke-width="1.4"/>
      <text x="20" y="360" font-size="15" fill="#526774">Dashed outline: our four-corner footprint.</text>
    </g>
    <g transform="translate(408 86)">
      <rect width="376" height="382" rx="12" fill="#fff" stroke="#dfe6e7"/>
      <text x="20" y="35" font-size="20" font-weight="700">...but very little clearance.</text>
      <text x="20" y="62" font-size="15" fill="#526774">Enlarged view of the highlighted area</text>
      <svg x="20" y="85" width="336" height="240" viewBox="88 155 84 60">
        <use href="#scene"/>
        <path d="M106.3 182.9 V169 M102 174 H106.3" fill="none" stroke="#526774" stroke-width=".45"/>
        <path d="M102 172.7 V175.3 M106.3 172.7 V175.3" stroke="#526774" stroke-width=".45"/>
        <text x="110" y="175.2" font-size="3.5" fill="#526774">Clearance</text>
      </svg>
      <text x="20" y="360" font-size="15" fill="#526774">Forward at this heading closes the gap.</text>
    </g>
    <path d="M24 489 H776" stroke="#dfe6e7"/>
    <text x="24" y="515" font-size="15" fill="#526774">A small heading error does not establish separation from the barrier.</text>
  </g>
</svg>
