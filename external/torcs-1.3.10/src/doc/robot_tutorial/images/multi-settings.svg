<svg xmlns="http://www.w3.org/2000/svg" width="800" height="590" viewBox="0 0 800 590" role="img" aria-labelledby="title desc">
  <title id="title">Each robot resolves its own configuration layers</title>
  <desc id="desc">Start with built-in or reference-car values, then module defaults and module track settings. Branch into the selected robot's default file and then its track file. Copy the resulting values into that robot's configuration. Missing or rejected entries retain earlier values.</desc>
  <!-- Copyright (C) 2026 Bernhard Wymann. GNU FDL 1.2-or-later. -->
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 1 L8 5 L2 9" fill="none" stroke="#397591" stroke-width="1.6"/></marker></defs>
  <rect width="800" height="590" fill="#fffdfa"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#243c4b">
    <text x="30" y="42" font-size="26">Resolve values separately for each index</text>
    <text x="30" y="70" font-size="15" fill="#526774">Paths below are relative to drivers/tutorialc/ in the installed data.</text>
    <g fill="#fff" stroke="#dfe6e7"><rect x="120" y="96" width="560" height="52" rx="12"/><rect x="120" y="174" width="560" height="52" rx="12"/><rect x="120" y="252" width="560" height="52" rx="12"/><rect x="30" y="352" width="350" height="58" rx="12"/><rect x="420" y="352" width="350" height="58" rx="12"/><rect x="30" y="438" width="350" height="58" rx="12"/><rect x="420" y="438" width="350" height="58" rx="12"/></g>
    <g font-size="18" text-anchor="middle">
      <text x="400" y="128">Built-in private / reference-car defaults</text>
      <text x="400" y="206">default.xml</text>
      <text x="400" y="284">g-track-1.xml</text>
      <text x="205" y="387">1/default.xml</text><text x="595" y="387">2/default.xml</text>
      <text x="205" y="473">1/g-track-1.xml</text><text x="595" y="473">2/g-track-1.xml</text>
    </g>
    <g fill="none" stroke="#397591" stroke-width="1.6" marker-end="url(#arrow)"><path d="M400 148 V174"/><path d="M400 226 V252"/><path d="M400 304 V326 H205 V352"/><path d="M400 326 H595 V352"/><path d="M205 410 V438"/><path d="M595 410 V438"/></g>
    <text x="205" y="531" text-anchor="middle" font-size="18" fill="#bf4939">Red's copied values</text><text x="595" y="531" text-anchor="middle" font-size="18" fill="#168376">Teal's copied values</text>
    <text x="30" y="568" font-size="15" fill="#526774">Later valid values win per key. An absent key keeps that robot's earlier value.</text>
  </g>
</svg>
