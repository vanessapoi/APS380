<svg xmlns="http://www.w3.org/2000/svg" width="800" height="570" viewBox="0 0 800 570" role="img" aria-labelledby="title description">
  <title id="title">Two questions. One steering decision.</title>
  <desc id="description">Two top-down views separate heading from position. On the left, a red sports car points left of the upward road direction. On the right, the car points along the road but sits left of its centerline. A dimension beneath the car marks its positive toMiddle distance; a rightward steering correction brings it toward the centerline.</desc>
  <!-- Copyright (C) 2026 Bernhard Wymann. GNU FDL 1.2 or later,
       with no Invariant Sections, Front-Cover Texts or Back-Cover Texts.
       Illustration conventions: see STYLE.txt beside this file. -->
  <defs>
    <marker id="road-arrow" markerWidth="11" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#397591" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="heading-arrow" markerWidth="11" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#bf4939" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="motion-arrow" markerWidth="11" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#168376" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="dimension-arrow" markerWidth="7" markerHeight="6" refX="5" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L6 3 L0 6 Z" fill="#526774"/></marker>
    <!-- One coupe silhouette throughout the tutorial. Local front is -Y. -->
    <g id="car">
      <g fill="#283b46">
        <rect x="-33" y="-38" width="9" height="23" rx="3"/>
        <rect x="24" y="-38" width="9" height="23" rx="3"/>
        <rect x="-33" y="25" width="9" height="23" rx="3"/>
        <rect x="24" y="25" width="9" height="23" rx="3"/>
      </g>
      <path d="M-15 -64 Q-23 -62 -26 -49 L-28 -25 L-25 6 Q-31 30 -29 47 Q-28 60 -17 64 L17 64 Q28 60 29 47 Q31 30 25 6 L28 -25 L26 -49 Q23 -62 15 -64 Z" fill="#db5947" stroke="#943e34" stroke-width="1.6"/>
      <path d="M-3 -61 H3 V-28 H-3 Z M-3 43 H3 V61 H-3 Z" fill="#fff6de"/>
      <path d="M-24 -21 Q0 -34 24 -21 L19 -2 Q0 -9 -19 -2 Z" fill="#bcd6dc" stroke="#536e7a" stroke-width="1.3"/>
      <path d="M-18 26 Q0 34 18 26 L22 42 Q0 50 -22 42 Z" fill="#bcd6dc" stroke="#536e7a" stroke-width="1.3"/>
      <path d="M-22 -12 L-22 18 L-17 23 L-17 2 Z M22 -12 L22 18 L17 23 L17 2 Z" fill="#486576"/>
      <path d="M-17 -1 Q0 -7 17 -1 L17 25 Q0 31 -17 25 Z" fill="#eb7058"/>
      <g fill="#fff1c9" stroke="#943e34" stroke-width="1">
        <path d="M-23 -47 L-12 -51 L-11 -43 L-24 -39 Z"/>
        <path d="M23 -47 L12 -51 L11 -43 L24 -39 Z"/>
      </g>
      <path d="M-23 55 H-11 M11 55 H23" stroke="#8d342f" stroke-width="3" stroke-linecap="round"/>
      <path d="M-10 -35 Q0 -38 10 -35" fill="none" stroke="#b14539" stroke-width="1.2"/>
    </g>
  </defs>
  <rect width="800" height="570" rx="16" fill="#fffdfa"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#243c4b">
    <text x="24" y="29" font-size="11" font-weight="700" letter-spacing="2">THE FIRST STEERING RULE</text>
    <text x="24" y="62" font-size="26" font-weight="700">Two questions. One steering decision.</text>
    <path d="M660 31 V16" fill="none" stroke="#397591" stroke-width="1.8" marker-end="url(#road-arrow)"/>
    <text x="674" y="28" font-size="12" fill="#526774">Travel direction</text>

    <!-- Heading: arrows are separated from the centerline and body. -->
    <g transform="translate(16 86)">
      <rect width="376" height="426" rx="12" fill="#fff" stroke="#dfe6e7"/>
      <circle cx="27" cy="31" r="12" fill="#e8f0f4"/>
      <text x="27" y="35" text-anchor="middle" font-size="13" font-weight="700" fill="#397591">1</text>
      <text x="49" y="37" font-size="20" font-weight="700">Which way am I pointing?</text>
      <text x="20" y="64" font-size="15" fill="#526774">Compare the car with the road.</text>
      <path d="M102 85 H324 V331 H102 Z" fill="#f0f4f4"/>
      <path d="M102 85 V331 M324 85 V331" stroke="#bbc9cd" stroke-width="1.5"/>
      <path d="M213 85 V331" stroke="#a7b9c0" stroke-width="1.5" stroke-dasharray="7 8"/>
      <use href="#car" transform="translate(210 248) rotate(-26) scale(.87)"/>
      <path d="M182 190 L148 120" fill="none" stroke="#bf4939" stroke-width="2.5" stroke-linecap="round" marker-end="url(#heading-arrow)"/>
      <text x="8" y="119" font-size="14" font-weight="700" fill="#a54134">Car heading</text>
      <text x="8" y="139" font-size="13" fill="#526774">nose direction</text>
      <path d="M271 181 V115" fill="none" stroke="#397591" stroke-width="2.5" stroke-linecap="round" marker-end="url(#road-arrow)"/>
      <text x="251" y="208" font-size="14" font-weight="700" fill="#397591">Road</text>
      <text x="240" y="227" font-size="14" fill="#526774">direction</text>
      <text x="20" y="363" font-size="16" font-weight="700">Heading error</text>
      <text x="20" y="387" font-size="15" fill="#526774">The car points left of the road direction.</text>
      <text x="20" y="409" font-size="15" fill="#526774">It needs to turn toward that direction.</text>
    </g>

    <!-- Position: the dimension is below the car, outside the road drawing. -->
    <g transform="translate(408 86)">
      <rect width="376" height="426" rx="12" fill="#fff" stroke="#dfe6e7"/>
      <circle cx="27" cy="31" r="12" fill="#e6f3ee"/>
      <text x="27" y="35" text-anchor="middle" font-size="13" font-weight="700" fill="#168376">2</text>
      <text x="49" y="37" font-size="20" font-weight="700">Where am I on the road?</text>
      <text x="20" y="64" font-size="15" fill="#526774">Pointing along it is only half the job.</text>
      <path d="M102 85 H324 V331 H102 Z" fill="#f0f4f4"/>
      <path d="M102 85 V331 M324 85 V331" stroke="#bbc9cd" stroke-width="1.5"/>
      <path d="M213 85 V331" stroke="#a7b9c0" stroke-width="1.5" stroke-dasharray="7 8"/>
      <use href="#car" transform="translate(148 248) scale(.87)"/>
      <path d="M150 180 Q160 151 195 142" fill="none" stroke="#168376" stroke-width="2.5" stroke-linecap="round" marker-end="url(#motion-arrow)"/>
      <text x="235" y="136" font-size="15" font-weight="700" fill="#168376">Steer right</text>
      <text x="235" y="156" font-size="14" fill="#526774">to the middle</text>
      <path d="M221 275 H251" stroke="#a7b9c0" stroke-width="1"/>
      <text x="257" y="280" font-size="13" fill="#526774">Centerline</text>
      <path d="M148 315 V348 M213 335 V348" stroke="#849aa5" stroke-width="1"/>
      <path d="M153 341 H208" stroke="#526774" stroke-width="1.2" marker-start="url(#dimension-arrow)" marker-end="url(#dimension-arrow)"/>
      <text x="226" y="346" font-size="14" font-family="monospace" fill="#526774">toMiddle &gt; 0</text>
      <text x="20" y="363" font-size="16" font-weight="700">Position error</text>
      <text x="20" y="387" font-size="15" fill="#526774">The car points along the road,</text>
      <text x="20" y="409" font-size="15" fill="#526774">but it is still left of the centerline.</text>
    </g>
    <path d="M24 532 H776" stroke="#dfe6e7"/>
    <text x="24" y="555" font-size="15" fill="#526774">Our steering rule combines both corrections. Top views; arrows are explanatory.</text>
  </g>
</svg>
