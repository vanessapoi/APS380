<svg xmlns="http://www.w3.org/2000/svg" width="800" height="580" viewBox="0 0 800 580" role="img" aria-labelledby="title description">
  <title id="title">Make room before you turn</title>
  <desc id="description">Three top-down schematic poses illustrate barrier recovery. First, the nose of a sideways car touches a barrier at the left road edge even though its center is not far from the centerline. Second, it reverses away to create clearance between the body and barrier. Third, with room available, it can turn and rejoin. The arrows indicate movement, not an exact computed trajectory.</desc>
  <!-- Copyright (C) 2026 Bernhard Wymann. GNU FDL 1.2 or later,
       with no Invariant Sections, Front-Cover Texts or Back-Cover Texts.
       Concept illustration for the recovery chapter; not an algorithm trace. -->
  <defs>
    <marker id="road-arrow" markerWidth="11" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#397591" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="motion-arrow" markerWidth="11" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#168376" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="dimension-arrow" markerWidth="7" markerHeight="6" refX="5" refY="3" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L6 3 L0 6 Z" fill="#526774"/></marker>
    <pattern id="barrier-hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-2 2 L2 -2 M0 8 L8 0 M6 10 L10 6" stroke="#b6c1c6" stroke-width="1"/></pattern>
    <g id="car">
      <g fill="#283b46">
        <rect x="-33" y="-38" width="9" height="23" rx="3"/>
        <rect x="24" y="-38" width="9" height="23" rx="3"/>
        <rect x="-33" y="25" width="9" height="23" rx="3"/>
        <rect x="24" y="25" width="9" height="23" rx="3"/>
      </g>
      <path d="M-15 -64 Q-23 -62 -26 -49 L-28 -25 L-25 6 Q-31 30 -29 47 Q-28 60 -17 64 L17 64 Q28 60 29 47 Q31 30 25 6 L28 -25 L26 -49 Q23 -62 15 -64 Z" fill="#db5947" stroke="#943e34" stroke-width="1.6"/>
      <path d="M-3 -61 H3 V-28 H-3 Z M-3 43 H3 V61 H-3 Z" fill="#fff6de"/>
      <path d="M-24 -21 Q0 -34 24 -21 L19 -2 Q0 -9 -19 -2 Z" fill="#bcd6dc" stroke="#536e7a" stroke-width="1.3"/>
      <path d="M-18 26 Q0 34 18 26 L22 42 Q0 50 -22 42 Z" fill="#bcd6dc" stroke="#536e7a" stroke-width="1.3"/>
      <path d="M-22 -12 L-22 18 L-17 23 L-17 2 Z M22 -12 L22 18 L17 23 L17 2 Z" fill="#486576"/>
      <path d="M-17 -1 Q0 -7 17 -1 L17 25 Q0 31 -17 25 Z" fill="#eb7058"/>
      <g fill="#fff1c9" stroke="#943e34" stroke-width="1">
        <path d="M-23 -47 L-12 -51 L-11 -43 L-24 -39 Z"/>
        <path d="M23 -47 L12 -51 L11 -43 L24 -39 Z"/>
      </g>
      <path d="M-23 55 H-11 M11 55 H23" stroke="#8d342f" stroke-width="3" stroke-linecap="round"/>
      <path d="M-10 -35 Q0 -38 10 -35" fill="none" stroke="#b14539" stroke-width="1.2"/>
    </g>
    <g id="road">
      <path d="M48 91 H226 V299 H48 Z" fill="#f0f4f4"/>
      <path d="M226 91 V299" stroke="#bbc9cd" stroke-width="1.5"/>
      <path d="M137 91 V299" stroke="#a7b9c0" stroke-width="1.5" stroke-dasharray="7 8"/>
      <rect x="35" y="91" width="13" height="208" fill="#dfe5e7"/>
      <rect x="35" y="91" width="13" height="208" fill="url(#barrier-hatch)"/>
      <path d="M48 91 V299" stroke="#526774" stroke-width="3"/>
    </g>
  </defs>
  <rect width="800" height="580" rx="16" fill="#fffdfa"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#243c4b">
    <text x="24" y="29" font-size="11" font-weight="700" letter-spacing="2">RECOVERY / CLEARANCE MATTERS</text>
    <text x="24" y="62" font-size="26" font-weight="700">Make room before you turn.</text>
    <path d="M660 31 V16" fill="none" stroke="#397591" stroke-width="1.8" marker-end="url(#road-arrow)"/>
    <text x="674" y="28" font-size="12" fill="#526774">Travel direction</text>
    <text x="24" y="86" font-size="15" fill="#526774">Being near the middle does not tell you whether the body is clear of a barrier.</text>

    <g transform="translate(16 108)">
      <rect width="248" height="384" rx="12" fill="#fff" stroke="#dfe6e7"/>
      <circle cx="27" cy="30" r="12" fill="#faebe4"/>
      <text x="27" y="34" text-anchor="middle" font-size="13" font-weight="700" fill="#a54134">1</text>
      <text x="49" y="36" font-size="20" font-weight="700">Notice the contact</text>
      <text x="20" y="64" font-size="13" letter-spacing="1" fill="#526774">STOPPED AT THE WALL</text>
      <use href="#road"/>
      <use href="#car" transform="translate(99.2 204) rotate(-90) scale(.8)"/>
      <circle cx="48" cy="204" r="9" fill="none" stroke="#c47a35" stroke-width="2"/>
      <path d="M53 191 L66 157 H71" fill="none" stroke="#9b703f" stroke-width="1.2"/>
      <text x="76" y="152" font-size="14" font-weight="700" fill="#9b703f">Contact</text>
      <text x="76" y="171" font-size="14" fill="#9b703f">at nose</text>
      <text x="20" y="332" font-size="15" font-weight="700">Small centerline offset.</text>
      <text x="20" y="356" font-size="15" fill="#526774">But the nose has no room</text>
      <text x="20" y="376" font-size="15" fill="#526774">to move farther forward.</text>
    </g>

    <g transform="translate(276 108)">
      <rect width="248" height="384" rx="12" fill="#fff" stroke="#dfe6e7"/>
      <circle cx="27" cy="30" r="12" fill="#e6f3ee"/>
      <text x="27" y="34" text-anchor="middle" font-size="13" font-weight="700" fill="#168376">2</text>
      <text x="49" y="36" font-size="20" font-weight="700">Back away</text>
      <text x="20" y="64" font-size="13" letter-spacing="1" fill="#526774">CREATE SOME SPACE</text>
      <use href="#road"/>
      <use href="#car" transform="translate(134.2 204) rotate(-90) scale(.8)"/>
      <path d="M151 153 H207" fill="none" stroke="#168376" stroke-width="2.5" stroke-linecap="round" marker-end="url(#motion-arrow)"/>
      <text x="148" y="134" font-size="14" font-weight="700" fill="#168376">Reverse</text>
      <path d="M48 306 V322 M83 244 V322" stroke="#849aa5" stroke-width="1"/>
      <path d="M53 313 H78" stroke="#526774" stroke-width="1.2" marker-start="url(#dimension-arrow)" marker-end="url(#dimension-arrow)"/>
      <text x="94" y="318" font-size="14" fill="#526774">Body clearance</text>
      <text x="20" y="356" font-size="15" fill="#526774">Move the body away</text>
      <text x="20" y="376" font-size="15" fill="#526774">from the barrier.</text>
    </g>

    <g transform="translate(536 108)">
      <rect width="248" height="384" rx="12" fill="#fff" stroke="#dfe6e7"/>
      <circle cx="27" cy="30" r="12" fill="#e6f3ee"/>
      <text x="27" y="34" text-anchor="middle" font-size="13" font-weight="700" fill="#168376">3</text>
      <text x="49" y="36" font-size="20" font-weight="700">Turn and rejoin</text>
      <text x="20" y="64" font-size="13" letter-spacing="1" fill="#526774">KEEP THE BODY CLEAR</text>
      <use href="#road"/>
      <use href="#car" transform="translate(155 231) rotate(-20) scale(.8)"/>
      <path d="M128 170 C114 148 121 134 121 112" fill="none" stroke="#168376" stroke-width="2.5" stroke-linecap="round" marker-end="url(#motion-arrow)"/>
      <text x="159" y="146" font-size="14" font-weight="700" fill="#168376">Forward</text>
      <text x="20" y="332" font-size="15" font-weight="700">Check the whole car.</text>
      <text x="20" y="356" font-size="15" fill="#526774">Leave room for its corners</text>
      <text x="20" y="376" font-size="15" fill="#526774">as its heading changes.</text>
    </g>
    <path d="M24 516 H776" stroke="#dfe6e7"/>
    <text x="24" y="541" font-size="15" font-weight="700">Measure space to the barrier, not just distance from the centerline.</text>
    <text x="24" y="563" font-size="13" fill="#526774">Schematic poses. Movement arrows explain the sequence; they are not a calculated path.</text>
  </g>
</svg>
