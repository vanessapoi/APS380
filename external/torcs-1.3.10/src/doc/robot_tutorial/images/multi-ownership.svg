<svg xmlns="http://www.w3.org/2000/svg" width="800" height="610" viewBox="0 0 800 610" role="img" aria-labelledby="title desc">
  <title id="title">One module, two independently owned driver objects</title>
  <desc id="desc">Two registration records route callback indices 1 and 2 to different TutorialDriver objects. Each owns its configuration and speed, recovery, traffic, and pit controllers. Car and track pointers are borrowed from the engine. Each callback writes only its own car controls.</desc>
  <!-- Copyright (C) 2026 Bernhard Wymann. GNU FDL 1.2-or-later. -->
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 1 L8 5 L2 9" fill="none" stroke="#397591" stroke-width="1.6"/></marker></defs>
  <rect width="800" height="610" fill="#fffdfa"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#243c4b">
    <text x="30" y="42" font-size="26">One module, two owners</text>
    <text x="30" y="70" font-size="16" fill="#526774">The callback index selects an object. The race-list position does not.</text>
    <rect x="30" y="96" width="740" height="88" rx="12" fill="#fff" stroke="#dfe6e7"/>
    <text x="400" y="128" text-anchor="middle" font-size="20">tutorialc.so / tutorialc.dll</text>
    <text x="400" y="158" text-anchor="middle" font-size="16">One exported entry point; two registration records</text>
    <g fill="none" stroke="#397591" stroke-width="1.6" marker-end="url(#arrow)"><path d="M205 184 V230"/><path d="M595 184 V230"/></g>
    <text x="50" y="214" font-size="15">slot 0 → index 1</text><text x="440" y="214" font-size="15">slot 1 → index 2</text>
    <rect x="30" y="230" width="350" height="250" rx="12" fill="#fff" stroke="#dfe6e7"/>
    <rect x="420" y="230" width="350" height="250" rx="12" fill="#fff" stroke="#dfe6e7"/>
    <rect x="30" y="244" width="5" height="222" fill="#db5947"/><rect x="420" y="244" width="5" height="222" fill="#278c9d"/>
    <text x="50" y="263" font-size="20">Tutorial C Red · 81</text><text x="440" y="263" font-size="20">Tutorial C Teal · 82</text>
    <g font-size="16">
      <text x="50" y="294">Drivers[0] owns this instance</text><text x="440" y="294">Drivers[1] owns this instance</text>
      <text x="50" y="328">Configuration values</text><text x="440" y="328">Configuration values</text>
      <text x="50" y="356">Speed + recovery controllers</text><text x="440" y="356">Speed + recovery controllers</text>
      <text x="50" y="384">Traffic + pit controllers</text><text x="440" y="384">Traffic + pit controllers</text>
      <text x="50" y="412">Fuel history + service state</text><text x="440" y="412">Fuel history + service state</text>
      <text x="50" y="451" fill="#526774">Borrowed track and own-car pointers</text><text x="440" y="451" fill="#526774">Borrowed track and own-car pointers</text>
    </g>
    <g fill="none" stroke="#397591" stroke-width="1.6" marker-end="url(#arrow)"><path d="M205 480 V524"/><path d="M595 480 V524"/></g>
    <rect x="30" y="524" width="740" height="62" rx="12" fill="#edf5f3" stroke="#dfe6e7"/>
    <text x="400" y="551" text-anchor="middle" font-size="18">One simulated world, two separate control outputs</text>
    <text x="400" y="576" text-anchor="middle" font-size="15" fill="#526774">The engine owns the cars, track and pit occupancy.</text>
  </g>
</svg>
