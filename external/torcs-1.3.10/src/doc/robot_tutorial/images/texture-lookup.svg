<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">Body texture lookup uses the first matching file</title>
  <desc id="desc">For Tutorial B's model-loaded car1-stock1.rgb body image, search the individual driver index folder, then the module folder, then the stock car folder. The compiled module and the race-list position do not determine the image name.</desc>
  <!-- Copyright (C) 2026 Bernhard Wymann. GNU FDL 1.2-or-later. -->
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 1 L8 5 L2 9" fill="none" stroke="#397591" stroke-width="1.6"/></marker></defs>
  <rect width="800" height="450" fill="#fffdfa"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#243c4b">
    <text x="30" y="42" font-size="26">The model asks for car1-stock1.rgb</text>
    <text x="30" y="70" font-size="16" fill="#526774">Check installed data paths in order. Stop at the first match.</text>
    <g fill="#fff" stroke="#dfe6e7"><rect x="30" y="96" width="740" height="78" rx="12"/><rect x="30" y="204" width="740" height="78" rx="12"/><rect x="30" y="312" width="740" height="78" rx="12"/></g>
    <g font-size="20">
      <text x="50" y="127">1 / Individual robot</text><text x="330" y="127" font-family="monospace" font-size="17">drivers/tutorialb/1/car1-stock1.rgb</text>
      <text x="50" y="235">2 / Module default</text><text x="330" y="235" font-family="monospace" font-size="17">drivers/tutorialb/car1-stock1.rgb</text>
      <text x="50" y="343">3 / Stock fallback</text><text x="330" y="343" font-family="monospace" font-size="17">cars/car1-stock1/car1-stock1.rgb</text>
    </g>
    <g font-size="15" fill="#526774"><text x="50" y="155">The folder number is the exported robot index, not its starting-grid position.</text><text x="50" y="263">The complete Tutorial B checkpoint installs its paint here.</text><text x="50" y="371">Keep the original image available for other drivers.</text></g>
    <g fill="none" stroke="#397591" stroke-width="1.6" marker-end="url(#arrow)"><path d="M90 174 V204"/><path d="M90 282 V312"/></g>
    <text x="110" y="194" font-size="14" fill="#397591">if absent</text><text x="110" y="302" font-size="14" fill="#397591">if absent</text>
    <text x="30" y="427" font-size="15" fill="#526774">This is the body-model search path. Pit logos have their own shared-pit rule.</text>
  </g>
</svg>
