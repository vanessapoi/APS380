<text x="24.00" y="62.00" font-size="26" fill="#243c4b" font-weight="700" text-anchor="start">Bring the components together deliberately.</text><rect x="24" y="100" width="752" height="105" rx="12" fill="#fff" stroke="#dfe6e7"/><text x="44.00" y="130.00" font-size="20" fill="#397591" font-weight="700" text-anchor="start">Racing</text><text x="44.00" y="160.00" font-size="15" fill="#526774" font-weight="400" text-anchor="start">Traffic chooses lateral intent; track and traffic restrict speed.</text><text x="44.00" y="186.00" font-size="15" fill="#526774" font-weight="400" text-anchor="start">Recovery can override a stuck car when nearby space is clear.</text><path d="M400.000 208.000 L400.000 222.000" fill="none" stroke="#168376" stroke-width="1.8" marker-end="url(#teal)"/><rect x="24" y="225" width="752" height="105" rx="12" fill="#fff" stroke="#dfe6e7"/><text x="44.00" y="255.00" font-size="20" fill="#397591" font-weight="700" text-anchor="start">Pit travel</text><text x="44.00" y="285.00" font-size="15" fill="#526774" font-weight="400" text-anchor="start">The pit spline owns steering. Apply road, pit, box and traffic speed caps.</text><text x="44.00" y="311.00" font-size="15" fill="#526774" font-weight="400" text-anchor="start">Main-road edge clamps must not pull the car out of the pit lane.</text><path d="M400.000 333.000 L400.000 347.000" fill="none" stroke="#168376" stroke-width="1.8" marker-end="url(#teal)"/><rect x="24" y="350" width="752" height="105" rx="12" fill="#fff" stroke="#dfe6e7"/><text x="44.00" y="380.00" font-size="20" fill="#397591" font-weight="700" text-anchor="start">Stopping and service</text><text x="44.00" y="410.00" font-size="15" fill="#526774" font-weight="400" text-anchor="start">Stop deliberately, request service, then wait for the engine’s release.</text><text x="44.00" y="436.00" font-size="15" fill="#526774" font-weight="400" text-anchor="start">Recovery must not mistake the intentional stop for being stuck.</text><path d="M400.000 458.000 L400.000 472.000" fill="none" stroke="#168376" stroke-width="1.8" marker-end="url(#teal)"/><rect x="24" y="475" width="752" height="105" rx="12" fill="#fff" stroke="#dfe6e7"/><text x="44.00" y="505.00" font-size="20" fill="#397591" font-weight="700" text-anchor="start">Exit and rejoin</text><text x="44.00" y="535.00" font-size="15" fill="#526774" font-weight="400" text-anchor="start">Keep the pit route after service. Check the corridor before merging.</text><text x="44.00" y="561.00" font-size="15" fill="#526774" font-weight="400" text-anchor="start">Once the body is on the main road, reset traffic into a checked return.</text><text x="24.00" y="625.00" font-size="16" fill="#526774" font-weight="400" text-anchor="start">One control owner per update; handoffs reset remembered manoeuvres.</text></g></svg>