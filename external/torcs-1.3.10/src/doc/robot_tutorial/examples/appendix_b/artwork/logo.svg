<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <title>Tutorial B team pit logo</title>
  <desc>The 256-pixel square has a constant grey perimeter. The visible pit message fits in the top two-thirds. The bottom third carries a small matching mark but is below this renderer's pit-wall sampling range.</desc>
  <!-- Copyright (C) 2026 Bernhard Wymann. Free Art License 1.3; see ../ARTWORK.txt. -->
  <g id="wall-colour"><rect width="256" height="256" fill="#747e84"/></g>
  <g id="pit-message">
    <rect x="8" y="8" width="240" height="154" rx="8" fill="#fff4db"/>
    <rect x="8" y="8" width="240" height="22" rx="8" fill="#db5947"/>
    <text x="128" y="73" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="bold" fill="#243c4b">TUTORIAL</text>
    <text x="128" y="135" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="65" font-weight="bold" fill="#db5947">B</text>
    <path d="M28 145 H98 M158 145 H228" stroke="#243c4b" stroke-width="4"/>
  </g>
  <g id="unused-lower-mark" fill="#fff4db" font-family="DejaVu Sans, sans-serif" text-anchor="middle">
    <text x="128" y="220" font-size="24" font-weight="bold">TORCS</text>
    <text x="128" y="241" font-size="12">LEARN · BUILD · RACE</text>
  </g>
</svg>
