<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Tutorial C Red number badges and lettering</title>
  <desc>Transparent decal overlay for the stock1 atlas. The three number badges have separate transforms. Paint and glass remain in the layered XCF.</desc>
  <!-- Copyright (C) 2026 Bernhard Wymann. Free Art License 1.3; see ../../ARTWORK.txt. -->
  <defs>
    <g id="badge">
      <rect x="-43" y="-43" width="86" height="86" rx="12" fill="#fff4db" stroke="#243c4b" stroke-width="3"/>
      <text x="0" y="20" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="54" font-weight="bold" fill="#243c4b">81</text>
    </g>
  </defs>
  <g id="side-numbers">
    <use href="#badge" transform="translate(503 514) rotate(180)"/>
    <use href="#badge" transform="translate(503 942)"/>
  </g>
  <g id="bonnet-number"><use href="#badge" transform="translate(750 728) rotate(90)"/></g>
  <g id="wing-lettering" fill="#fff4db" font-family="DejaVu Sans, sans-serif" font-weight="bold" text-anchor="middle">
    <text x="728" y="86" font-size="64">TUTORIAL C</text>
    <rect x="488" y="105" width="480" height="8"/>
  </g>
  <g id="roof-lettering" transform="translate(385 726) rotate(-90)" fill="#fff4db" font-family="DejaVu Sans, sans-serif" text-anchor="middle">
    <text y="-9" font-size="40" font-weight="bold">TORCS</text>
    <text y="25" font-size="25" letter-spacing="6">LEARN</text>
  </g>
</svg>
